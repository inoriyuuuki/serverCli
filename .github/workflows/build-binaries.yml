# =============================================================================
# ServerCLI 二进制构建工作流（面向物理主机部署，不依赖 Docker）
#
# 触发方式：
#   1) 推送 tag（如 v1.0.0）-> 构建全部目标平台并自动发布 GitHub Release
#   2) 手动触发 workflow_dispatch -> 可选指定 tag 与目标平台，仅上传 Actions Artifact
#
# 产物（每个平台一个自包含 tar.gz 包）：
#   - bin/servercli-control-plane、bin/servercli-node-agent（纯 Go，CGO_ENABLED=0）
#   - frontend/dist（前端静态资源，由控制面托管）
#   - commands/（命令 manifest 与可执行文件）
#   - deploy/（环境示例 + systemd 模板 + lease shell）、scripts/、VERSION、INSTALL.md
#
# 旧的 Docker 镜像构建工作流已停用，见 .github/workflows/docker-build.yml.disabled
# =============================================================================
name: Build ServerCLI Binaries

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（可选，留空则构建当前分支，TAG=分支名）'
        required: false
        type: string
      platforms:
        description: '目标平台（逗号分隔 os/arch），默认 linux/amd64,linux/arm64'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 解析版本号与目标平台矩阵
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve version & platforms
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & platforms
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # ---- 版本号 ----
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag '${TAG}' does not exist"
              exit 1
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${TAG}"

          # ---- 目标平台（os/arch，逗号分隔）----
          PLATFORMS="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
          MATRIX="["
          FIRST=1
          IFS=',' read -r -a ARR <<< "${PLATFORMS}"
          for p in "${ARR[@]}"; do
            p="$(printf '%s' "${p}" | tr -d '[:space:]')"
            [ -z "${p}" ] && continue
            OS="${p%/*}"
            ARCH="${p#*/}"
            case "${OS}" in
              linux|darwin|windows|freebsd|openbsd|netbsd|dragonfly|solaris|illumos) ;;
              *) echo "::error::Unsupported OS: ${OS}"; exit 1 ;;
            esac
            case "${ARCH}" in
              amd64|arm64|386|arm|riscv64|ppc64le|s390x) ;;
              *) echo "::error::Unsupported ARCH: ${ARCH}"; exit 1 ;;
            esac
            if [ "${FIRST}" -eq 1 ]; then FIRST=0; else MATRIX+=","; fi
            MATRIX+="{\"os\":\"${OS}\",\"arch\":\"${ARCH}\"}"
          done
          if [ "${FIRST}" -eq 1 ]; then
            echo "::error::platforms is empty"
            exit 1
          fi
          MATRIX+="]"
          echo "platforms=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Platforms: ${MATRIX}"

          # ---- 是否发布 GitHub Release（仅 tag 推送触发）----
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 构建前端静态资源（所有平台共用一份 dist）
  # ---------------------------------------------------------------------------
  frontend:
    name: Build frontend (dist)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 交叉编译 Go 后端并打包（每个平台一个自包含 bundle）
  # ---------------------------------------------------------------------------
  binaries:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.platforms) }}
    env:
      VERSION: ${{ needs.prepare.outputs.tag }}
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build backend binaries
        run: |
          cd backend
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.build=github-actions -X main.commit=${GITHUB_SHA}" \
            -o ../bin/servercli-control-plane ./cmd/control-plane
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.build=github-actions -X main.commit=${GITHUB_SHA}" \
            -o ../bin/servercli-node-agent ./cmd/node-agent

      - name: Package release bundle
        run: |
          set -euo pipefail
          SAFE_VERSION="$(printf '%s' "${VERSION}" | tr '/' '-')"
          ROOT="servercli-${SAFE_VERSION}-${GOOS}-${GOARCH}"
          ARCHIVE="${ROOT}.tar.gz"

          mkdir -p "${ROOT}/bin" "${ROOT}/frontend" "${ROOT}/deploy"
          cp bin/servercli-control-plane bin/servercli-node-agent "${ROOT}/bin/"
          cp -R frontend/dist "${ROOT}/frontend/dist"
          cp -R commands "${ROOT}/commands"
          cp -R scripts "${ROOT}/scripts"
          cp -R deploy/environments deploy/systemd "${ROOT}/deploy/"
          cp deploy/servercli-lease-shell.sh "${ROOT}/deploy/"
          cp start.sh check.sh README.md "${ROOT}/"
          printf '%s\n' "${VERSION}" > "${ROOT}/VERSION"

          cp deploy/INSTALL.md "${ROOT}/INSTALL.md"

          find "${ROOT}" -name '.DS_Store' -delete
          chmod +x "${ROOT}/bin/"* "${ROOT}/scripts/"*.sh "${ROOT}/start.sh" "${ROOT}/check.sh" "${ROOT}/deploy/servercli-lease-shell.sh"
          tar -czf "${ARCHIVE}" "${ROOT}"
          sha256sum "${ARCHIVE}" > sha256sums.txt
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${ROOT}" >> "$GITHUB_ENV"
          echo "Bundle: ${ARCHIVE}"
          ls -lh "${ARCHIVE}"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            *.tar.gz
            sha256sums.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # tag 推送时发布 GitHub Release 并附加全部 bundle
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [prepare, binaries]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 2 -type f -name '*.tar.gz' -exec mv -f {} . \;
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          sha256sum *.tar.gz > sha256sums.txt
          ls -la

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          # Idempotent publish: if a release for this tag already exists (e.g.
          # re-running the workflow or re-pushing the same tag), upload the
          # assets with --clobber instead of failing with "already exists".
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release '${TAG}' already exists; uploading/overwriting assets"
            gh release upload "${TAG}" *.tar.gz sha256sums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" *.tar.gz sha256sums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ServerCLI ${TAG}" \
              --generate-notes
          fi

  # ---------------------------------------------------------------------------
  # 构建产物上传到公开 OSS 桶（inori-image）——首次引导（bootstrap）从此桶下载
  # ServerCLI Agent，不再经 xray 访问 GitHub。
  #
  # 对象命名：oss://inori-image/servercli/<tag>/servercli-<tag>-linux-<arch>.tar.gz
  #          + sha256sums.txt
  # 下载 URL：https://inori-image.<public-endpoint>/servercli/<tag>/...
  #
  # 依赖仓库 Secrets（需在 GitHub Settings -> Secrets 配置）：
  #   ALIYUN_OSS_AK_ID / ALIYUN_OSS_AK_SECRET / ALIYUN_OSS_ENDPOINT
  #   （ENDPOINT 用公网 endpoint，如 oss-cn-hangzhou.aliyuncs.com；
  #     Bucket 固定为 inori-image。AK 仅需该桶 servercli/ 前缀的写权限。）
  # 未配置 Secrets 时本任务自动跳过（不影响 GitHub Release 发布）。
  # ---------------------------------------------------------------------------
  upload-oss:
    name: Upload bundles to OSS (inori-image)
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 2 -type f -name '*.tar.gz' -exec mv -f {} . \;
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          sha256sum *.tar.gz > sha256sums.txt
          ls -la

      # 运行时检查 Secrets（不在 if: 中引用 secrets 上下文，避免 workflow 校验问题）：
      # 未配置 ALIYUN_OSS_AK_ID/ALIYUN_OSS_AK_SECRET 时跳过上传（不影响 GitHub Release）。
      - name: Upload bundles to OSS
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          OSS_BUCKET: inori-image
          OSS_AK_ID: ${{ secrets.ALIYUN_OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_OSS_AK_SECRET }}
          OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${OSS_AK_ID:-}" ] || [ -z "${OSS_AK_SECRET:-}" ]; then
            echo "::warning::ALIYUN_OSS_AK_ID / ALIYUN_OSS_AK_SECRET 未配置，跳过 OSS 上传（不影响 GitHub Release 发布）"
            exit 0
          fi
          if [ -z "${OSS_ENDPOINT:-}" ]; then
            echo "::warning::ALIYUN_OSS_ENDPOINT 未配置，使用默认 oss-cn-hangzhou.aliyuncs.com"
            OSS_ENDPOINT="oss-cn-hangzhou.aliyuncs.com"
          fi
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil-bin
          OSSUTIL_BIN="$(find /tmp/ossutil-bin -type f -name ossutil64 | head -1)"
          [ -n "$OSSUTIL_BIN" ] || { echo "::error::ossutil64 not found in archive"; exit 1; }
          sudo install -m 0755 "$OSSUTIL_BIN" /usr/local/bin/ossutil
          ossutil --version
          ossutil config -e "$OSS_ENDPOINT" -i "$OSS_AK_ID" -k "$OSS_AK_SECRET" -c /tmp/ossutil.conf
          cd dist
          # 固定 latest 命名（不区分版本号）：servercli-latest-linux-<arch>.tar.gz
          for f in servercli-*-linux-*.tar.gz; do
            [ -e "$f" ] || continue
            arch="${f##*-linux-}"; arch="${arch%.tar.gz}"
            mv -f "$f" "servercli-latest-linux-${arch}.tar.gz"
          done
          sha256sum servercli-latest-*.tar.gz > sha256sums.txt
          prefix="oss://${OSS_BUCKET}/servercli/latest/"
          for f in servercli-latest-*.tar.gz sha256sums.txt; do
            echo "upload: ${prefix}${f}"
            ossutil cp -c /tmp/ossutil.conf -f "${f}" "${prefix}${f}"
          done
          echo "已上传: ${prefix}（公开读，供首次引导下载最新 Agent，不区分版本号）"
