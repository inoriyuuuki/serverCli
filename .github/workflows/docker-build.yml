name: Publish Docker image

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（可选，留空则直接构建当前分支，TAG=分支名）'
        required: false
        type: string
      platforms:
        description: 'Target platforms (comma separated)'
        required: false
        default: 'linux/amd64'
        type: string

# 镜像名优先级: 仓库变量 DOCKER_IMAGE > DOCKERHUB_USERNAME/servercli > github.repository(自动转小写)
# 例如在 GitHub 仓库 Settings -> Secrets and variables -> Actions -> Variables
# 添加 DOCKER_IMAGE=<dockerhub用户名>/servercli 可固定推送到自己的 Docker Hub 账号
# 不设 DOCKER_IMAGE 时, 自动用 DOCKERHUB_USERNAME 作为命名空间, 与登录账号保持一致

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发且未指定 tag：直接构建当前分支，TAG 取分支名
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG}"

      - name: Resolve image name
        id: img
        run: |
          if [ -n "${{ vars.DOCKER_IMAGE }}" ]; then
            IMAGE="${{ vars.DOCKER_IMAGE }}"
          elif [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/servercli"
          else
            IMAGE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          fi
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Resolved image: ${IMAGE}"

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            BUILD=github-actions
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
