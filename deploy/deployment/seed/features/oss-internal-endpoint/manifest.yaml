# =============================================================================
# Feature Manifest — OSS Internal Endpoint (oss-internal-endpoint)
# ServerCLI Feature Bundle 契约（servercli/v1）
# 本文件是控制面导入/上传 OSS 的权威内容模板；不含任何真实 Secret。
# =============================================================================
apiVersion: servercli/v1
kind: Feature
metadata:
  name: OSS Internal Endpoint
  description: 阿里云 OSS 内网 Endpoint 基础配置（backup_mode=none）
spec:
  feature_key: oss-internal-endpoint
  os: linux
  arch: amd64
  minimum_agent_version: "0.2.0"
  dependencies:
    []
  backup_mode: none
  rollback_capability: false
  config_schema:
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "type": "object",
      "required": [
        "node_id",
        "environment_id",
        "hostname",
        "feature_key",
        "release_version",
        "deployment_root_dir",
        "operation_id"
      ],
      "properties": {
        "node_id": {
          "type": "string",
          "description": "控制面生成的节点 ID"
        },
        "environment_id": {
          "type": "string",
          "description": "环境 ID（如 production）"
        },
        "hostname": {
          "type": "string",
          "description": "目标主机名"
        },
        "feature_key": {
          "type": "string",
          "const": "oss-internal-endpoint"
        },
        "release_version": {
          "type": "string",
          "default": "0.1.0",
          "description": "目标 release 版本"
        },
        "deployment_root_dir": {
          "type": "string",
          "default": "/opt/servercli-deployment",
          "description": "部署根目录"
        },
        "operation_id": {
          "type": "string",
          "description": "本次操作 ID（幂等与审计）"
        },
        "data_dir": {
          "type": "string",
          "default": "/opt/servercli-deployment/data/oss-internal-endpoint",
          "description": "数据目录"
        },
        "config_dir": {
          "type": "string",
          "default": "/opt/servercli-deployment/configs/oss-internal-endpoint",
          "description": "配置目录"
        },
        "rendered_dir": {
          "type": "string",
          "default": "/opt/servercli-deployment/rendered/oss-internal-endpoint",
          "description": "渲染产物目录"
        },
        "ports": {
          "type": "array",
          "items": {
            "type": "integer"
          },
          "default": [],
          "description": "服务端口列表"
        },
        "oss_region": {
          "type": "string",
          "default": "cn-hangzhou"
        },
        "oss_endpoint": {
          "type": "string",
          "default": "oss-cn-hangzhou-internal.aliyuncs.com"
        },
        "oss_bucket": {
          "type": "string",
          "default": "your-oss-bucket"
        },
        "oss_prefix": {
          "type": "string",
          "default": "deployment-repository/"
        }
      },
      "additionalProperties": true
    }
  hooks:
    install: hooks/install.sh
    update: hooks/update.sh
    backup: hooks/backup.sh
    health-check: hooks/health-check.sh
    rollback: hooks/rollback.sh
